name: proektdeyat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15

  web:
    build: .
    command:
      - /bin/sh
      - -c
      - bundle install && bin/rails db:prepare && bin/rails tailwindcss:build && rm -f tmp/pids/server.pid && exec bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_development
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - npm install && npm run dev
    volumes:
      - ./frontend:/app
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    depends_on:
      - web

volumes:
  postgres_data:
